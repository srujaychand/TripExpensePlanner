<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Trip Expense Planner</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      background: #f7f9fc;
      color: #333;
    }
    header {
      background: #0077b6;
      color: white;
      padding: 15px;
      text-align: center;
    }
    .container {
      max-width: 900px;
      margin: 20px auto;
      background: white;
      padding: 20px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }
    .tabs { display: flex; margin-bottom: 20px; }
    .tab { flex: 1; padding: 10px; text-align: center; cursor: pointer; border-bottom: 2px solid #ccc; }
    .tab.active { border-bottom: 2px solid #0077b6; font-weight: bold; }
    .tab-content { display: none; }
    .tab-content.active { display: block; }
    .form-group { margin-bottom: 12px; }
    .form-group label { display: block; margin-bottom: 4px; }
    .form-group input, .form-group select, .form-group textarea {
      width: 100%; padding: 7px; border: 1px solid #ccc; border-radius: 4px;
      box-sizing: border-box;
    }
    .btn {
      background: #0077b6; color: white; border: none; padding: 8px 16px;
      border-radius: 4px; cursor: pointer; margin-right: 8px;
    }
    .btn:hover { background: #005f8e; }
    table { width: 100%; border-collapse: collapse; margin-top: 15px; }
    table, th, td { border: 1px solid #aaa; }
    th, td { padding: 8px; text-align: left; }
    th { background: #e0f0ff; }
    .settlement-table th, .settlement-table td { text-align: center; }
    .table-responsive { overflow-x: auto; width: 100%; }

    .icon-btn {
      border: none;
      border-radius: 8px;
      padding: 6px 10px;
      margin-left: 5px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      color: white;
      font-size: 13px;
      font-weight: 500;
      transition: all 0.25s ease;
      box-shadow: 0 2px 5px rgba(0,0,0,0.15);
    }
    .icon-btn.edit { background: #0077b6; }
    .icon-btn.edit:hover { transform: translateY(-2px); box-shadow: 0 4px 10px rgba(59,130,246,0.4); }
    .icon-btn.delete { background: #fc1e35; }
    .icon-btn.delete:hover { transform: translateY(-2px); box-shadow: 0 4px 10px rgba(239,68,68,0.4); }

    @media print {
      body * { visibility: hidden; }
      .print-area, .print-area * { visibility: visible; }
      .print-area { position: absolute; top: 0; left: 0; width: 100%; }
    }
  </style>
</head>
<body>

  <header>
    <h1>Trip Expense Planner</h1>
  </header>

  <div class="container">
    <div class="tabs">
      <div class="tab active" data-tab="expenses">Expenses</div>
      <div class="tab" data-tab="settlement">Settlement</div>
      <div class="tab" data-tab="deposits">Deposits</div>
    </div>

    <!-- EXPENSES TAB -->
    <div class="tab-content active" id="expenses">
      <h2>Register People</h2>
      <div class="form-group">
        <label for="personName">Person Name</label>
        <input type="text" id="personName" placeholder="Enter name"/>
      </div>
      <button class="btn" onclick="addPerson()">Add Person</button>
      <h3>People List:</h3>
      <ul id="peopleList"></ul>
      <hr/>

      <h2>Add Expense</h2>
      <div class="form-group">
        <label for="expDate">Date</label>
        <input type="date" id="expDate"/>
      </div>
      <div class="form-group">
        <label for="category">Category</label>
        <select id="category">
          <option value="">-- Select --</option>
          <option value="Food">Food</option>
          <option value="Hotel">Hotel</option>
          <option value="Travel">Travel</option>
          <option value="Others">Others</option>
        </select>
      </div>
      <div class="form-group">
        <label for="amount">Amount</label>
        <input type="number" id="amount" placeholder="Amount"/>
      </div>
      <div class="form-group">
        <label>Involved Persons</label>
        <div id="involvedPersonsContainer"></div>
      </div>
      <div class="form-group">
        <label for="notes">Notes</label>
        <textarea id="notes" rows="2" placeholder="Any notes..."></textarea>
      </div>
      <button class="btn" onclick="addExpense()">Add Expense</button>

      <div class="table-responsive">
        <h3>Expenses List</h3>
        <table id="expenseTable">
          <thead>
            <tr>
              <th>Date</th><th>Category</th><th>Amount</th><th>Involved</th><th>Notes</th><th>Action</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>

      <hr/>
      <button class="btn" onclick="printAll()">Print All (Expenses + Settlement)</button>
      <button class="btn" onclick="resetAll()">Reset All Data</button>
      <p><small>Reset password: <strong>1234</strong></small></p>
    </div>

    <!-- SETTLEMENT TAB -->
    <div class="tab-content" id="settlement">
      <h2>Settlement</h2>
      <table class="settlement-table" id="settlementTable">
        <thead>
          <tr><th>Person</th><th>Total Paid</th><th>Total Share</th><th>Balance</th></tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>

    <!-- DEPOSITS TAB -->
    <div class="tab-content" id="deposits">
      <h2>Deposits</h2>
      <table id="depositTable">
        <thead>
          <tr><th>Person</th><th>Amount</th><th>Action</th></tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
  </div>

  <div class="print-area" id="print-area"></div>

<script>
/* ---------- CONFIG ---------- */
const RESET_PASSWORD = "1234";

/* ---------- STORAGE & MIGRATION ---------- */
function loadData() {
  // migrate if people stored as ["name","name"]
  let peopleRaw = JSON.parse(localStorage.getItem('people') || '[]');
  if (peopleRaw.length && typeof peopleRaw[0] === 'string') {
    // convert to objects with stable id
    peopleRaw = peopleRaw.map((n, idx) => ({ id: 'p' + Date.now() + '_' + idx, name: n }));
  }
  const expenses = JSON.parse(localStorage.getItem('expenses') || '[]').map(e => {
    // older expenses may have involved as names; convert names -> ids if possible
    return e;
  });
  const deposits = JSON.parse(localStorage.getItem('deposits') || '[]').map(d => {
    return d;
  });
  // if expenses used names earlier, we'll map them later after people load
  return { people: peopleRaw, expenses, deposits };
}
function saveData(p, e, d) {
  localStorage.setItem('people', JSON.stringify(p));
  localStorage.setItem('expenses', JSON.stringify(e));
  localStorage.setItem('deposits', JSON.stringify(d));
}

/* ---------- HELPERS ---------- */
function findPersonNameById(id) {
  const { people } = loadData();
  const found = people.find(x => x.id === id);
  return found ? found.name : '(unknown)';
}
function ensureExpenseInvolvedIds() {
  // Convert legacy expenses that stored involved as names into ids when possible.
  const data = loadData();
  const { people, expenses, deposits } = data;
  const nameToId = {};
  people.forEach(p => nameToId[p.name] = p.id);
  let changed = false;
  expenses.forEach(exp => {
    if (!Array.isArray(exp.involved)) exp.involved = [];
    // detect if first element is a name (string without 'p' prefix) — we assume ids start with 'p'
    if (exp.involved.length && exp.involved[0] && !exp.involved[0].startsWith?.('p')) {
      // convert names to ids where possible
      exp.involved = exp.involved.map(n => nameToId[n] || n); // keep original if mapping missing
      changed = true;
    }
  });
  if (changed) saveData(people, expenses, deposits);
}

/* ---------- PEOPLE ---------- */
function refreshPeopleList() {
  const { people } = loadData();
  const ul = document.getElementById('peopleList');
  ul.innerHTML = '';
  people.forEach((p, i) => {
    const li = document.createElement('li');
    li.innerHTML = `
      ${escapeHtml(p.name)}
      <button class="icon-btn edit" onclick="editPerson('${p.id}')">Edit</button>
      <button class="icon-btn delete" onclick="deletePerson('${p.id}')">Delete</button>`;
    ul.appendChild(li);
  });

  // involved persons container (checkboxes) uses stable ids
  const cont = document.getElementById('involvedPersonsContainer');
  cont.innerHTML = '';
  people.forEach(p => {
    const cb = document.createElement('input');
    cb.type = 'checkbox';
    cb.id = 'involve_' + p.id;
    cb.value = p.id;
    cb.checked = true;
    const lbl = document.createElement('label');
    lbl.htmlFor = cb.id; lbl.textContent = p.name;
    const div = document.createElement('div');
    div.appendChild(cb); div.appendChild(lbl);
    cont.appendChild(div);
  });
}

function addPerson() {
  const nameEl = document.getElementById('personName');
  const name = nameEl.value.trim();
  if (!name) return alert('Enter a name');
  const { people, expenses, deposits } = loadData();
  if (people.some(p => p.name.toLowerCase() === name.toLowerCase())) return alert('Person already exists');
  const newPerson = { id: 'p' + Date.now() + '_' + Math.floor(Math.random()*1000), name };
  people.push(newPerson);
  saveData(people, expenses, deposits);
  nameEl.value = '';
  refreshPeopleList();
}

/* Edit by id */
function editPerson(personId) {
  const pwd = prompt('Enter password to edit:');
  if (pwd !== RESET_PASSWORD) return alert('Wrong password.');
  const data = loadData();
  const { people, expenses, deposits } = data;
  const idx = people.findIndex(p => p.id === personId);
  if (idx === -1) return alert('Person not found');
  const oldName = people[idx].name;
  const newName = prompt('Enter new name:', oldName);
  if (!newName) return;
  people[idx].name = newName.trim();
  // update deposits (they use personId) -> no change needed; expenses store ids -> no change to ids, only names shown by lookup
  saveData(people, expenses, deposits);
  refreshPeopleList(); refreshExpenseTable(); refreshDepositsTable();
}

/* Delete person by id */
function deletePerson(personId) {
  const pwd = prompt('Enter password to delete:');
  if (pwd !== RESET_PASSWORD) return alert('Wrong password.');
  const data = loadData();
  const { people, expenses, deposits } = data;
  const person = people.find(p => p.id === personId);
  if (!person) return alert('Person not found');
  if (!confirm(`Delete ${person.name}? This will remove them from deposits and expenses.`)) return;
  // Remove person
  const newPeople = people.filter(p => p.id !== personId);
  // Remove any expenses where they were involved (or alternatively remove them from involved list — here we remove the expense)
  const newExpenses = expenses.filter(e => !e.involved.includes(personId));
  // Remove deposits entry for that person
  const newDeposits = deposits.filter(d => d.personId !== personId);
  saveData(newPeople, newExpenses, newDeposits);
  refreshPeopleList(); refreshExpenseTable(); refreshDepositsTable();
}

/* ---------- EXPENSES ---------- */
function refreshExpenseTable() {
  ensureExpenseInvolvedIds();
  const { expenses } = loadData();
  const tbody = document.querySelector('#expenseTable tbody');
  tbody.innerHTML = '';
  expenses.forEach((e, i) => {
    const involvedNames = (e.involved || []).map(id => escapeHtml(findPersonNameById(id))).join(', ');
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td>${escapeHtml(e.date || '')}</td>
      <td>${escapeHtml(e.category || '')}</td>
      <td>${Number(e.amount).toFixed(2)}</td>
      <td>${involvedNames}</td>
      <td>${escapeHtml(e.notes || '')}</td>
      <td>
        <button class="icon-btn edit" onclick="openEditModal(${i})">Edit</button>
        <button class="icon-btn delete" onclick="deleteExpense(${i})">Delete</button>
      </td>`;
    tbody.appendChild(tr);
  });
}

function addExpense() {
  const date = document.getElementById('expDate').value;
  const cat = document.getElementById('category').value;
  const amt = parseFloat(document.getElementById('amount').value);
  const notes = document.getElementById('notes').value;
  if (!date || !cat || isNaN(amt)) return alert('Fill all fields');
  const { people, expenses, deposits } = loadData();
  const involved = people.filter(p => document.getElementById('involve_' + p.id)?.checked).map(p => p.id);
  if (!involved.length) return alert('Select at least one person');
  expenses.push({ date, category: cat, amount: amt, notes, involved });
  saveData(people, expenses, deposits);
  // reset form
  document.getElementById('category').value = '';
  document.getElementById('amount').value = '';
  document.getElementById('notes').value = '';
  setDefaultDate();
  refreshExpenseTable();
}

/* Delete expense by index */
function deleteExpense(i) {
  const pwd = prompt('Enter password:');
  if (pwd !== RESET_PASSWORD) return alert('Wrong password.');
  const d = loadData();
  d.expenses.splice(i, 1);
  saveData(d.people, d.expenses, d.deposits);
  refreshExpenseTable();
}

/* ---------- EDIT EXPENSE MODAL ---------- */
function openEditModal(i) {
  const pwd = prompt('Enter password to edit expense:');
  if (pwd !== RESET_PASSWORD) return alert('Wrong password.');
  const data = loadData();
  const { people, expenses, deposits } = data;
  const e = expenses[i];
  if (!e) return alert('Expense not found');

  const modal = document.createElement('div');
  modal.style.cssText = `
    position:fixed;top:0;left:0;width:100%;height:100%;
    background:rgba(0,0,0,0.45);display:flex;align-items:center;
    justify-content:center;z-index:9999;padding:20px;box-sizing:border-box;
  `;

  modal.innerHTML = `
    <div style="background:white;padding:18px;border-radius:10px;width:420px;max-width:100%;">
      <h3 style="margin-top:0;margin-bottom:8px;">Edit Expense</h3>
      <div style="margin-bottom:8px;"><label>Date</label><input id="editDate" type="date" value="${escapeAttr(e.date)}" style="width:100%;padding:6px;margin-top:4px;"></div>
      <div style="margin-bottom:8px;"><label>Category</label><input id="editCategory" type="text" value="${escapeAttr(e.category)}" style="width:100%;padding:6px;margin-top:4px;"></div>
      <div style="margin-bottom:8px;"><label>Amount</label><input id="editAmount" type="number" value="${escapeAttr(e.amount)}" style="width:100%;padding:6px;margin-top:4px;"></div>
      <div style="margin-bottom:8px;"><label>Notes</label><textarea id="editNotes" style="width:100%;padding:6px;margin-top:4px;">${escapeHtml(e.notes || '')}</textarea></div>
      <div style="margin-bottom:10px;"><label>Involved</label><div id="editPeopleList" style="max-height:140px;overflow:auto;border:1px solid #eee;padding:8px;border-radius:6px;margin-top:6px;"></div></div>
      <div style="text-align:right;">
        <button class="btn" id="saveEditBtn">Save</button>
        <button class="btn" id="cancelEditBtn" style="background:#ccc;color:#000;">Cancel</button>
      </div>
    </div>
  `;

  document.body.appendChild(modal);
  const list = modal.querySelector('#editPeopleList');
  people.forEach(p => {
    const div = document.createElement('div');
    div.style.marginBottom = '6px';
    const checked = (e.involved || []).includes(p.id) ? 'checked' : '';
    div.innerHTML = `<input id="chk_${p.id}" type="checkbox" value="${p.id}" ${checked}> <label for="chk_${p.id}">${escapeHtml(p.name)}</label>`;
    list.appendChild(div);
  });

  modal.querySelector('#cancelEditBtn').onclick = () => modal.remove();
  modal.querySelector('#saveEditBtn').onclick = () => {
    const date = modal.querySelector('#editDate').value;
    const cat = modal.querySelector('#editCategory').value.trim();
    const amt = parseFloat(modal.querySelector('#editAmount').value);
    const notes = modal.querySelector('#editNotes').value;
    const involved = people.filter(p => modal.querySelector('#chk_' + p.id)?.checked).map(p => p.id);
    if (!date || !cat || isNaN(amt) || involved.length === 0) return alert('Invalid data');
    e.date = date; e.category = cat; e.amount = amt; e.notes = notes; e.involved = involved;
    saveData(people, expenses, deposits);
    refreshExpenseTable();
    modal.remove();
  };
}

/* ---------- DEPOSITS ---------- */
function refreshDepositsTable() {
  const { people, deposits } = loadData();
  const tbody = document.querySelector('#depositTable tbody');
  tbody.innerHTML = '';
  people.forEach(p => {
    const d = deposits.find(x => x.personId === p.id);
    const amt = d ? d.amount : 0;
    const tr = document.createElement('tr');
    tr.innerHTML = `<td>${escapeHtml(p.name)}</td>
      <td><input type="number" id="dep_${p.id}" value="${escapeAttr(amt)}" min="0"></td>
      <td><button class="btn" onclick="updateDeposit('${p.id}')">Save</button></td>`;
    tbody.appendChild(tr);
  });
}

function updateDeposit(personId) {
  const pwd = prompt('Enter password:');
  if (pwd !== RESET_PASSWORD) return alert('Wrong password.');
  const amt = parseFloat(document.getElementById('dep_' + personId).value || '0');
  const data = loadData();
  const { people, expenses, deposits } = data;
  const ex = deposits.find(d => d.personId === personId);
  if (ex) ex.amount = amt; else deposits.push({ personId, amount: amt });
  saveData(people, expenses, deposits);
  refreshDepositsTable();
}

/* ---------- SETTLEMENT ---------- */
function refreshSettlementTab() {
  ensureExpenseInvolvedIds();
  const { people, expenses, deposits } = loadData();
  const tbody = document.querySelector('#settlementTable tbody');
  tbody.innerHTML = '';

  // initialize maps
  const share = {};
  const dep = {};
  people.forEach(p => { share[p.id] = 0; dep[p.id] = (deposits.find(d => d.personId === p.id)?.amount) || 0; });

  let totalDeposits = 0, totalExpenses = 0;
  // calc shares and totals
  expenses.forEach(e => {
    const partCount = (e.involved && e.involved.length) || 1;
    const per = e.amount / partCount;
    (e.involved || []).forEach(id => {
      if (share[id] === undefined) share[id] = 0;
      share[id] += per;
    });
    totalExpenses += Number(e.amount) || 0;
  });
  people.forEach(p => totalDeposits += Number(dep[p.id]) || 0);

  // render per person rows
  people.forEach(p => {
    const totalPaid = Number(dep[p.id] || 0);
    const totalShare = Number(share[p.id] || 0);
    const balance = totalPaid - totalShare;
    const tr = document.createElement('tr');
    tr.innerHTML = `<td>${escapeHtml(p.name)}</td><td>${totalPaid.toFixed(2)}</td><td>${totalShare.toFixed(2)}</td><td>${balance.toFixed(2)}</td>`;
    tbody.appendChild(tr);
  });

  // summary area (separate from table totals row)
  const summaryBox = document.getElementById('settlement-summary');
  if (summaryBox) {
    summaryBox.innerHTML = `
      <div style="display:flex;gap:12px;flex-wrap:wrap;margin-top:12px;">
        <div style="background:#e8f7ff;padding:8px;border-radius:6px;min-width:160px;">
          <div style="font-size:12px;color:#555">Total Deposits</div>
          <div style="font-weight:700;font-size:18px">${totalDeposits.toFixed(2)}</div>
        </div>
        <div style="background:#fff0f0;padding:8px;border-radius:6px;min-width:160px;">
          <div style="font-size:12px;color:#555">Total Expenses</div>
          <div style="font-weight:700;font-size:18px">${totalExpenses.toFixed(2)}</div>
        </div>
        <div style="background:#f0fff7;padding:8px;border-radius:6px;min-width:160px;">
          <div style="font-size:12px;color:#555">Remaining Balance</div>
          <div style="font-weight:700;font-size:18px">${(totalDeposits - totalExpenses).toFixed(2)}</div>
        </div>
      </div>
    `;
  }
}

/* ---------- PRINT ---------- */
function printAll() {
  ensureExpenseInvolvedIds();
  const { people, expenses, deposits } = loadData();

  // build HTML for printing
  let html = `<h2>Expenses</h2><table style="width:100%;border-collapse:collapse;" border="1">
    <thead><tr><th>Date</th><th>Category</th><th>Amount</th><th>Involved</th><th>Notes</th></tr></thead><tbody>`;
  expenses.forEach(e => {
    const involvedNames = (e.involved || []).map(id => escapeHtml(findPersonNameById(id))).join(', ');
    html += `<tr><td>${escapeHtml(e.date)}</td><td>${escapeHtml(e.category)}</td><td>${Number(e.amount).toFixed(2)}</td><td>${involvedNames}</td><td>${escapeHtml(e.notes||'')}</td></tr>`;
  });
  html += `</tbody></table>`;

  // Settlement summary and per-person
  let totalDeposits = 0, totalExpenses = 0;
  const share = {}, dep = {};
  people.forEach(p => { share[p.id] = 0; dep[p.id] = (deposits.find(d => d.personId === p.id)?.amount) || 0; totalDeposits += dep[p.id]; });
  expenses.forEach(e => {
    const partCount = (e.involved && e.involved.length) || 1;
    const per = e.amount / partCount;
    (e.involved || []).forEach(id => { share[id] = (share[id] || 0) + per; });
    totalExpenses += Number(e.amount) || 0;
  });

  html += `<h2 style="margin-top:18px;">Settlement</h2>
    <table style="width:100%;border-collapse:collapse;" border="1">
      <thead><tr><th>Person</th><th>Total Paid</th><th>Total Share</th><th>Balance</th></tr></thead><tbody>`;
  people.forEach(p => {
    const totalPaid = Number(dep[p.id] || 0);
    const totalShare = Number(share[p.id] || 0);
    const balance = totalPaid - totalShare;
    html += `<tr><td>${escapeHtml(p.name)}</td><td>${totalPaid.toFixed(2)}</td><td>${totalShare.toFixed(2)}</td><td>${balance.toFixed(2)}</td></tr>`;
  });
  html += `</tbody></table>`;

  html += `<div style="margin-top:12px;">
    <strong>Total Deposits:</strong> ${totalDeposits.toFixed(2)} &nbsp; &nbsp;
    <strong>Total Expenses:</strong> ${totalExpenses.toFixed(2)} &nbsp; &nbsp;
    <strong>Remaining Balance:</strong> ${(totalDeposits - totalExpenses).toFixed(2)}
  </div>`;

  // open print window
  const win = window.open('', '_blank');
  win.document.write(`<html><head><title>Print</title></head><body>${html}</body></html>`);
  win.document.close();
  win.focus();
  setTimeout(() => { win.print(); win.close(); }, 300);
}

/* ---------- UTILITIES ---------- */
function setDefaultDate(){document.getElementById('expDate').value=new Date().toISOString().slice(0,10);}

function resetAll(){
  const pwd = prompt('Enter reset password:');
  if (pwd !== RESET_PASSWORD) return alert('Wrong password.');
  localStorage.clear();
  refreshPeopleList(); refreshExpenseTable(); refreshDepositsTable();
  document.querySelector('#settlementTable tbody').innerHTML = '';
  const summaryBox = document.getElementById('settlement-summary');
  if (summaryBox) summaryBox.innerHTML = '';
}

/* ---------- TABS ---------- */
document.querySelectorAll('.tab').forEach(tab=>{
  tab.addEventListener('click',()=>{
    document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
    document.querySelectorAll('.tab-content').forEach(tc=>tc.classList.remove('active'));
    tab.classList.add('active');
    const id=tab.dataset.tab;
    document.getElementById(id).classList.add('active');
    if(id==='settlement') refreshSettlementTab();
    if(id==='deposits') refreshDepositsTable();
  });
});

/* ---------- SAFE HTML helpers ---------- */
function escapeHtml(s) {
  if (s === null || s === undefined) return '';
  return String(s)
    .replaceAll('&','&amp;')
    .replaceAll('<','&lt;')
    .replaceAll('>','&gt;')
    .replaceAll('"','&quot;')
    .replaceAll("'",'&#39;');
}
function escapeAttr(s) {
  if (s === null || s === undefined) return '';
  return String(s).replaceAll('"','&quot;');
}

/* ---------- INITIALIZE ONLOAD ---------- */
window.onload = () => {
  // ensure older data formats converted
  ensureExpenseInvolvedIds();
  setDefaultDate();
  refreshPeopleList();
  refreshExpenseTable();
  // create a settlement summary container if not present
  const settlementTab = document.getElementById('settlement');
  if (settlementTab && !document.getElementById('settlement-summary')) {
    const summary = document.createElement('div');
    summary.id = 'settlement-summary';
    settlementTab.appendChild(summary);
  }
  refreshDepositsTable();
};
</script>
